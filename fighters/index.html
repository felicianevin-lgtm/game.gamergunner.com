<body>
  <canvas id="canvas" tabindex="0"></canvas>

  <div id="hud" class="hidden">
    <div id="hBtns"><button type="button" id="bMute" title="Sound on/off (M)">🔊</button><button type="button" id="bPause" title="Pause (Esc)">⏸</button></div>
  </div>

  <div id="touch" class="hidden">
    <div id="dpad"><i class="u">▲</i><i class="l">◀</i><i class="r">▶</i><i class="d">▼</i></div>
    <div id="tbtns">
      <button type="button" data-k="L" class="tL">PUNCH</button>
      <button type="button" data-k="H" class="tH">KICK</button>
      <button type="button" data-k="S" class="tS">SPECIAL</button>
      <button type="button" data-k="X" class="tX" id="tX">SUPER</button>
    </div>
  </div>

  <div id="rotate"><b>📱↻</b>Turn your device sideways to brawl!</div>

  <div id="menu" class="panel">
    <div class="box">
      <h1><span>BONK</span> BRAWLERS</h1>
      <p class="sub">Pick a brawler and bonk your way to the top! Punches, kicks, blocks, wild special moves and cartoon knockouts. Win 2 rounds to win the match.</p>
      <div class="btns col">
        <button type="button" id="b1p" class="big">🤖 1 PLAYER <small>vs the computer</small></button>
        <button type="button" id="b2p" class="big alt">👥 2 PLAYERS <small>on one keyboard</small></button>
      </div>
      <div id="diff"><span>Computer:</span><button type="button" data-d="easy">Easy</button><button type="button" data-d="normal">Normal</button><button type="button" data-d="hard">Hard</button></div>
      <p id="controls"></p>
      <div class="foot"><a class="back" href="../#/">← GunnerVerse</a><button type="button" id="mMute" class="link">🔊 Sound on</button></div>
    </div>
  </div>

  <div id="select" class="panel hidden">
    <div class="box wide">
      <h2 id="selTitle">Pick your brawler!</h2>
      <div class="selRow">
        <div class="pinfo p1" id="info0"></div>
        <div id="grid"></div>
        <div class="pinfo p2" id="info1"></div>
      </div>
      <div class="btns"><button type="button" id="selBack">← Back</button><button type="button" id="selRandom">🎲 Random</button><button type="button" id="selGo" class="big" disabled>FIGHT! ▶</button></div>
      <p class="hint" id="selHint"></p>
    </div>
  </div>

  <div id="pause" class="panel hidden"><div class="box"><h2>Paused</h2><div class="btns col"><button type="button" id="resume" class="big">▶ Keep brawling</button><button type="button" id="restart">↻ Restart match</button><button type="button" id="pSelect">Change brawlers</button><button type="button" id="pMenu">Menu</button></div></div></div>

  <div id="over" class="panel hidden">
    <div class="box">
      <canvas id="overPic" width="160" height="160"></canvas>
      <h2 id="overTitle"></h2>
      <p class="sub" id="overSub"></p>
      <div class="btns col"><button type="button" id="again" class="big">↻ Rematch</button><button type="button" id="oSelect" class="big alt">Change brawlers</button><button type="button" id="oMenu">Menu</button></div>
    </div>
  </div>

  <script type="module" src="js/main.js?v=702e16ae36"></script>
</body>
