<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="heat"></div>
  <div id="flash"></div>

  <div id="hud" class="hidden">
    <div id="hTop"><b id="hNow">0 m</b><small id="hBest">BEST 0 m</small></div>
    <div id="hCoins"><i class="coin"></i><b id="hCoinN">0</b></div>
    <div id="hBtns"><button type="button" id="bMute" title="Sound on/off (M)">🔊</button><button type="button" id="bPause" title="Pause (Esc)">⏸</button></div>
    <div id="meter"><span>LAVA</span><div id="mBar"><i id="mFill"></i><em id="mYou"></em></div><b id="mDist">10 m</b></div>
    <div id="toast"></div>
    <div id="secName"></div>
    <div id="stick"><i></i></div>
    <button type="button" id="tJump">JUMP</button>
  </div>

  <div id="menu" class="panel side">
    <div class="box">
      <h1><span>LAVA</span> TOWER</h1>
      <p class="sub">The lava is rising! Climb the endless tower of jumps, spinning bars, jump pads and falling tiles. How high can you get?</p>
      <div class="btns"><button type="button" id="play" class="big">▶ PLAY</button></div>
      <div class="stats"><span>🏔️ Best: <b id="mBest">0 m</b></span><span><i class="coin"></i> <b id="mCoins">0</b> coins</span></div>
      <div class="shop">
        <h3>Shop <small>spend your coins on a new look</small></h3>
        <div class="row" id="shopSkins"></div>
        <div class="row" id="shopHats"></div>
        <p id="shopMsg"></p>
      </div>
      <p id="controls"></p>
      <div class="foot"><a class="back" href="../#/">← GunnerVerse</a><button type="button" id="mMute" class="link">🔊 Sound on</button></div>
    </div>
  </div>

  <div id="pause" class="panel hidden"><div class="box"><h2>Paused</h2><div class="btns col"><button type="button" id="resume" class="big">▶ Keep climbing</button><button type="button" id="restart">↻ Start over</button><button type="button" id="quit">Menu</button></div></div></div>

  <div id="dead" class="panel hidden">
    <div class="box">
      <h2 class="burn">BURNED!</h2>
      <p class="sub" id="deadMsg"></p>
      <p id="deadBest"></p>
      <div class="btns col"><button type="button" id="cont" class="big">🚩 Continue from checkpoint</button><button type="button" id="again" class="big alt">↻ Try again</button><button type="button" id="dMenu">Menu</button></div>
    </div>
  </div>

  <div id="thumbTitle" class="hidden"><h1>LAVA<br>TOWER</h1><p>CLIMB OR BURN!</p></div>
